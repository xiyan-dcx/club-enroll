server.address=127.0.0.1
server.port=${CLUB_PORT:18080}
spring.application.name=qingju
spring.config.import=optional:file:./.local/database.properties
spring.datasource.url=${CLUB_DB_URL:${jdbc.url}}
spring.datasource.username=${CLUB_DB_USERNAME:${jdbc.username}}
spring.datasource.password=${CLUB_DB_PASSWORD:${jdbc.password}}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000
spring.data.redis.host=${CLUB_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${CLUB_REDIS_PORT:16379}
spring.data.redis.timeout=2s
spring.kafka.bootstrap-servers=${CLUB_KAFKA:127.0.0.1:19092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.consumer.group-id=qingju-business-v1
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.admin.fail-fast=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.call-setters-on-nulls=true
mybatis-plus.global-config.db-config.id-type=auto
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
qingju.rate-limit=${CLUB_RATE_LIMIT:60}
qingju.events.enabled=${CLUB_EVENTS_ENABLED:true}
